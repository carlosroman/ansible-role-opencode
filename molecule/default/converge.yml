---
- name: Converge
  hosts: all

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt: update_cache=true cache_valid_time=600
      changed_when: false
      when: ansible_os_family == 'Debian'

  roles:
    - role: carlosroman.opencode

  tasks:
    - name: Install a pinned OpenCode version into a custom directory
      ansible.builtin.include_role:
        name: carlosroman.opencode
      vars:
        opencode_version: "2.0.20"
        opencode_install_dir: /opt/opencode-pinned/bin

    - name: Install latest OpenCode via the npm registry fallback (broken update API)
      ansible.builtin.include_role:
        name: carlosroman.opencode
      vars:
        opencode_update_api_url: http://127.0.0.1:1/update/api/latest/cli/opencode
        opencode_install_dir: /opt/opencode-fallback/bin
